# A topologia do broker é da infraestrutura do ambiente, e não do produtor: a Strategy declara a
# exchange de forma passiva e trata exchange inexistente como falha permanente. Na stack local, a
# exchange `example`, a fila `example.audit` e o usuário `app` (senha `app`) vêm deste arquivo.
load_definitions = /etc/rabbitmq/definitions.json
